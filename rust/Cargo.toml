[package]
name = "adblock-jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "adblock_jni"
crate-type = ["cdylib"]

[dependencies]
adblock = "0.9"
jni = "0.21"
libc = "0.2"
# adblock 0.9 uses rmp-serde 0.15, which breaks on rmp >= 0.8.11. Pin the last compatible version.
rmp = "=0.8.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
